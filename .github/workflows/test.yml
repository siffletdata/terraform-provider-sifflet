# Terraform Provider testing workflow.
name: Tests

on:
  # Run acceptance tests on pull requests
  # (not including "push" event to avoid duplicated jobs)
  pull_request:
    paths-ignore:
      - "README.md"
  # To catch potential regressions in the API that impact
  # this Terraform provider, also run tests on a weekly schedule.
  schedule:
    - cron: "17 22 * * 0"

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11.4

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.*"
          terraform_wrapper: false
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform:
          # Supported Terraform versions:
          #
          # We don't use any fancy Terraform feature, so for now we assume that testing with both
          # the oldest and latest support versions is enough.
          # This reduce the number of concurrent calls to the Sifflet API to avoid throttling.
          #
          # = Oldest =
          # IBM supports Terraform versions for 2 years, see https://cloud.ibm.com/docs/schematics?topic=schematics-deprecate-tf-version
          # Let's support the oldest version still supported by IBM.
          - "1.9.*"
          # = Latest =
          - "1.15.*"
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: "1"
          SIFFLET_HOST: ${{ secrets.SIFFLET_TF_PROVIDER_HOST }}
          SIFFLET_TOKEN: ${{ secrets.SIFFLET_TF_PROVIDER_TOKEN }}
        run: go test -v -cover ./...
        timeout-minutes: 10
